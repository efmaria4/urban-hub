<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Guest guide for Urban Hub, Thessaloniki">
<meta name="theme-color" content="#dcedf7">
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Urban Hub">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Urban Hub">
<meta property="og:title" content="Urban Hub · Guest Guide">
<meta property="og:description" content="Getting in, Wi-Fi, house tips and our favourite spots in Thessaloniki.">
<meta property="og:url" content="https://efmaria4.github.io/urban-hub/">
<meta property="og:image" content="https://efmaria4.github.io/urban-hub/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Urban Hub Guest Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-first "app" — illustrated bay header, quick-action grid, ask box, then soft rounded sections in arrival order. Thermaikos sky, sunny yellow, coral. */
:root{
  --bg:#f2f7fb; --card:#ffffff; --ink:#1d3341; --muted:#5f7685; --line:#dbe7ef;
  --sea:#2f7396; --sky:#dcedf7; --sun:#ffc94d; --sun-soft:#fff3cf; --coral:#ef7f63; --coral-soft:#fde6df; --mint:#3fa57f;
  --todo:#fff1c2; --todo-ink:#7a5a00; --todo-line:#e9be4a;
  --f-display:"Fredoka", "Nunito", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1b24; --card:#152733; --ink:#e7f1f7; --muted:#9db4c2; --line:#24404f;
  --sea:#7fc3e4; --sky:#1b3747; --sun:#ffd26b; --sun-soft:#3a3013; --coral:#f79b82; --coral-soft:#3b2620; --mint:#6fd1a9;
  --todo:#3a2f10; --todo-ink:#f5d888; --todo-line:#a8862e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b24; --card:#152733; --ink:#e7f1f7; --muted:#9db4c2; --line:#24404f;
  --sea:#7fc3e4; --sky:#1b3747; --sun:#ffd26b; --sun-soft:#3a3013; --coral:#f79b82; --coral-soft:#3b2620; --mint:#6fd1a9;
  --todo:#3a2f10; --todo-ink:#f5d888; --todo-line:#a8862e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,8vw,42px);line-height:1.05}
h2{font-size:24px;line-height:1.2}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
a{color:var(--sea);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}

/* hero */
.hero{background:var(--sky);border-radius:0 0 32px 32px;overflow:hidden}
.hero-inner{padding-block:28px 0;display:flex;flex-direction:column;gap:8px}
.hello{font-weight:800;color:var(--sea);font-size:14px;letter-spacing:.04em}
.sub{color:var(--muted);max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px}
.chip{background:color-mix(in srgb,var(--card) 55%,transparent);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.bay{display:block;width:100%;height:auto;margin-top:12px}

/* status */
.status{margin-top:-18px;position:relative;background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px -12px rgba(20,60,90,.35)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mint);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 25%,transparent)}
.dot.quiet{background:var(--coral);box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 25%,transparent)}
.status p{font-size:14px}

/* quick actions */
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa a,.qa button{background:var(--card);border:0;border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;text-align:center;line-height:1.25}
.qa a:hover,.qa button:hover{transform:translateY(-2px)}
.qa a,.qa button{transition:transform .15s}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i1{background:var(--sky);color:var(--sea)} .i2{background:var(--sun-soft);color:var(--todo-ink)} .i3{background:var(--coral-soft);color:var(--coral)}

/* ask */
.ask{background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.ask-row{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px}
.ask input:focus{border-color:var(--sea);outline:none}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sea)}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ans b{font-family:var(--f-display);font-weight:600}
.ans a{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--sea);color:var(--bg)}
.btn.alt{background:var(--sky);color:var(--sea)}
.totop{align-self:flex-end;background:none;border:0;padding:6px 2px;font:inherit;font-size:14px;font-weight:800;color:var(--sea);cursor:pointer}
.totop:hover{text-decoration:underline}
.btn.wa{background:var(--mint);color:var(--bg)}

/* sections */
main{display:flex;flex-direction:column;gap:28px;padding-block:24px 8px}
.block{display:flex;flex-direction:column;gap:12px;scroll-margin-top:72px}
/* key facts in the header */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.fact{background:color-mix(in srgb,var(--card) 60%,transparent);border:0;border-radius:12px;padding:5px 9px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);min-width:0;cursor:default}
button.fact{cursor:pointer}
.fact small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--f-body);font-weight:700;font-size:13px;line-height:1.35;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sticky jump menu */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
.jump .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.jump .wrap::-webkit-scrollbar{display:none}
.jump a{flex:none;white-space:nowrap;text-decoration:none;font-weight:800;font-size:13px;color:var(--ink);background:var(--card);border-radius:999px;padding:6px 12px}
.jump a[aria-current="true"]{background:var(--sea);color:var(--bg)}
/* floating back-to-top */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:46px;height:46px;border-radius:50%;border:0;background:var(--sea);color:var(--bg);font-size:22px;font-weight:800;line-height:1;box-shadow:0 6px 18px -6px rgba(20,60,90,.55);cursor:pointer}
.install{align-self:flex-start}
.tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rows{background:var(--card);border-radius:var(--r);overflow:hidden}
.rows details{border-top:1px solid var(--line)}
.rows details:first-child{border-top:0}
.rows summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.rows summary::-webkit-details-marker{display:none}
.rows summary::after{content:"+";font-family:var(--f-display);font-size:22px;color:var(--sea);line-height:1;flex:none}
.rows details[open] summary::after{content:"–"}
.rows .body{padding:0 18px 16px;color:var(--muted)}
.rows .body a{color:var(--sea);text-decoration:underline;text-decoration-color:var(--coral);text-underline-offset:3px}
.todo{background:var(--todo);color:var(--todo-ink);border:1px dashed var(--todo-line);border-radius:6px;padding:0 6px;font-weight:700;font-size:.92em}

/* stepper */
.stepper{background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:6px}
.prog span{flex:1;height:6px;border-radius:6px;background:var(--line)}
.prog span.on{background:var(--sea)}
.step-num{font-weight:800;color:var(--sea);font-size:13px}
.photo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.howto{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.thermo{display:grid;grid-template-columns:3fr 2fr;gap:8px;margin:10px 0;align-items:center}
.thermo img{width:100%;border-radius:12px;background:#fff;padding:6px}
.photo img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:16px;background:var(--line)}
.nav-row{display:flex;justify-content:space-between;gap:8px}

/* picks */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters button{border:0;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--sea);color:var(--bg)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.more{align-self:center}
.pick{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pick .cat{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
.pick p{color:var(--muted);font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:800;color:var(--sea);background:var(--sky);border-radius:999px;padding:1px 8px;margin-right:2px;white-space:nowrap}
.trip-more{align-self:flex-start;margin-top:6px;border:0;background:var(--sky);color:var(--sea);font:inherit;font-weight:800;font-size:13px;border-radius:999px;padding:5px 12px;cursor:pointer}
.pick.has-trip{cursor:pointer;transition:transform .15s}
.pick.has-trip:active{transform:scale(.98)}
body.modal-open{overflow:hidden}
.trip-modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,25,35,0);transition:background .25s}
.trip-modal.show{background:rgba(10,25,35,.55)}
.trip-card{position:relative;width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;opacity:0}
.trip-modal.show .trip-card{opacity:1}
.trip-close{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#1d3341;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.trip-imgs{display:grid;gap:4px}
.trip-imgs.n2{grid-template-columns:1fr 1fr}
.trip-imgs img{display:block;width:100%;height:260px;object-fit:cover;background:var(--line)}
.trip-imgs.n2 img{height:200px}
.trip-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.trip-body .cat{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
.trip-body h3{font-size:22px}
.trip-body p{color:var(--muted)}
.trip-rows{display:flex;flex-direction:column;gap:8px}
.trip-rows:empty{display:none}
#tripMap{align-self:flex-start;margin-top:4px}
@media (prefers-reduced-motion:reduce){.trip-card,.trip-modal{transition:none}}
.trip-row{display:flex;flex-direction:column;font-size:14px}
.trip-row b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sea)}
.trip-row span{color:var(--muted)}
.pick h3 a{color:inherit;text-decoration:underline;text-decoration-color:var(--coral);text-decoration-thickness:2px;text-underline-offset:3px}
.pick h3 a span{color:var(--coral);font-size:.85em}

/* extras */
.extra{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.extra:first-of-type{border-top:0}
.extra input,.check input{width:22px;height:22px;accent-color:var(--sea);flex:none;margin-top:2px}
.extra span{display:flex;flex-direction:column;flex:1;min-width:0}
.extra small{color:var(--muted);font-size:14px}
.price{font-weight:800;color:var(--sea);white-space:nowrap}

/* checkout */
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.check label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.done{background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-weight:700}

.time-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.time-row input{font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:20}
footer{padding-block:24px 48px;text-align:center;color:var(--muted);font-size:14px}
.legend{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* language switcher */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.langs{display:flex;gap:6px}
.langs button{display:flex;align-items:center;gap:6px;border:2px solid transparent;background:var(--card);border-radius:999px;padding:4px 10px 4px 5px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
.langs button[aria-pressed="true"]{border-color:var(--sea)}
.flag{width:24px;height:16px;border-radius:4px;overflow:hidden;display:block;flex:none;box-shadow:0 0 0 1px var(--line)}
.flag svg{width:100%;height:100%;display:block}
.copyNum{padding:3px 10px;font-size:13px;margin-left:4px}
</style>
</head>
<body>


<div class="hero">
  <div class="wrap hero-inner">
    <div class="topbar">
      <span class="hello" id="hello"></span>
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
    </div>
    <h1>Urban Hub</h1>
    <p class="sub" data-t="sub"></p>
    <div class="facts" id="facts"></div>
    <div class="chips" id="chips"></div>
  </div>
  <svg class="bay" viewBox="0 0 400 110" aria-hidden="true">
    <circle cx="330" cy="38" r="20" fill="var(--sun)"/>
    <g fill="var(--card)">
      <rect x="64" y="34" width="26" height="52" rx="3"/>
      <rect x="61" y="28" width="32" height="8" rx="2"/>
      <rect x="66" y="20" width="22" height="10" rx="2"/>
    </g>
    <g fill="var(--sky)"><rect x="70" y="44" width="4" height="7" rx="2"/><rect x="80" y="44" width="4" height="7" rx="2"/><rect x="75" y="60" width="4" height="7" rx="2"/></g>
    <path d="M230 78 l30 0 l-6 9 l-18 0 z" fill="var(--coral)"/><path d="M244 78 v-24 l14 20 z" fill="var(--card)"/>
    <path d="M0 86 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V110 H0 z" fill="var(--sea)" opacity=".35"/>
    <path d="M0 94 q25 -9 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V110 H0 z" fill="var(--sea)" opacity=".7"/>
  </svg>
</div>

<div class="wrap">
  <div class="status" role="status"><span class="dot" id="dot"></span><p id="statusText"></p></div>
</div>

<nav class="jump" aria-label="Sections"><div class="wrap" id="jump"></div></nav>

<main class="wrap">

<section class="block" id="quick">
  <h2 data-t="quickTitle"></h2>
  <div class="qa">
    <button type="button" id="qaWifi"><span class="ico i1"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/></svg></span><span data-t="qaWifi"></span></button>
    <a href="https://www.google.com/maps/search/?api=1&query=Dialetti+17+Thessaloniki" target="_blank" rel="noopener"><span class="ico i2"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span><span data-t="qaDir"></span></a>
    <a href="#door"><span class="ico i3"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="15" cy="12" r="1" fill="currentColor"/></svg></span><span data-t="qaDoor"></span></a>
    <a id="qaWa" href="#" target="_blank" rel="noopener"><span class="ico i1"><svg viewBox="0 0 24 24"><path d="M4 20l1.4-4A8 8 0 1 1 8 19z"/></svg></span><span data-t="qaMsg"></span></a>
    <a href="#city"><span class="ico i2"><svg viewBox="0 0 24 24"><path d="M5 11h14l-1 8H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span data-t="qaEat"></span></a>
    <a href="#checkout"><span class="ico i3"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span><span data-t="qaOut"></span></a>
  </div>
  <p class="legend">Wi-Fi: <b>Urban Hub 5G</b> · <span data-t="password"></span>: <b id="wifiPass"></b></p>
  <p class="legend" data-t="offline"></p>
  <button class="btn alt install" id="installBtn" type="button" hidden data-t="install"></button>
</section>

<section class="block">
  <div class="ask">
    <h2 data-t="askTitle"></h2>
    <p class="muted" data-t="askHint"></p>
    <form class="ask-row" id="askForm">
      <input id="askInput" type="search" autocomplete="off" aria-label="Question">
      <button class="btn" type="submit" data-t="askBtn"></button>
    </form>
    <div class="suggest" id="suggest"></div>
    <div class="answers" id="answers" aria-live="polite"></div>
  </div>
</section>

<section class="block" id="arrive">
  <span class="tag" data-t="arriveTag"></span>
  <h2 data-t="arriveTitle"></h2>
  <div class="rows" data-rows="arrive"></div>
  <div class="card">
    <h3 data-t="arrCardTitle"></h3>
    <div class="time-row"><label for="arrTime" class="muted" data-t="arrLabel"></label><input id="arrTime" type="time" value="15:00"><a class="btn wa" id="arrSend" href="#" target="_blank" rel="noopener" data-t="sendWa"></a></div>
  </div>
</section>

<section class="block" id="door">
  <span class="tag" data-t="doorTag"></span>
  <h2 data-t="doorTitle"></h2>
  <div class="stepper">
    <div class="prog" id="prog"></div>
    <span class="step-num" id="stepNum"></span>

// ===== engine =====
var lang = "en";
function L(){ return TEXT[lang] || TEXT.en; }
function t(k){ var v = L()[k]; return v !== undefined ? v : TEXT.en[k]; }
function fmt(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k] !== undefined ? o[k] : ""; }); }
function $(id){ return document.getElementById(id); }
function wa(text){ return "https://wa.me/" + HOST_PHONE + "?text=" + encodeURIComponent(text); }
function toast(s){ var el=$("toast"); el.textContent=s; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true},1800); }
function copy(text, label){
  var msg = label + " " + t("copied");
  try{ navigator.clipboard.writeText(text).then(function(){toast(msg)},function(){toast(text)}); }catch(e){ toast(text); }
}
function phonesHtml(){ return PHONES.map(function(p,i){ return p[0]+': <b>'+p[1]+'</b> <button class="btn alt copyNum" type="button" data-i="'+i+'">'+(lang==="el"?"Αντιγραφή":"Copy")+'</button>'; }).join("<br>"); }

function renderStatic(){
  document.documentElement.lang = lang;
  [].forEach.call(document.querySelectorAll("[data-t]"), function(el){ el.innerHTML = t(el.getAttribute("data-t")); });
  var F = t("facts");
  $("facts").innerHTML = '<div class="fact"><small>'+F[0][0]+'</small><b>'+F[0][1]+'</b></div><div class="fact"><small>'+F[1][0]+'</small><b>'+F[1][1]+'</b></div><button class="fact" type="button" id="factWifi"><small>'+F[2][0]+'</small><b>'+F[2][1]+'</b></button>';
  $("factWifi").addEventListener("click", function(){ if (WIFI_PASS) copy(WIFI_PASS, t("wifiLabel")); });
  $("jump").innerHTML = t("nav").map(function(label, i){ return '<a href="#'+JUMP[i]+'" data-sec="'+JUMP[i]+'">'+label+'</a>'; }).join("");
  markActive();
  $("chips").innerHTML = t("chips").map(function(c){ return '<span class="chip">'+c+'</span>'; }).join("");
  $("askInput").placeholder = t("askPh");
  $("wifiPass").textContent = WIFI_PASS || t("wifiHidden");
  [].forEach.call(document.querySelectorAll("[data-rows]"), function(box){
    var list = (L().rows && L().rows[box.getAttribute("data-rows")]) || TEXT.en.rows[box.getAttribute("data-rows")];
    box.innerHTML = list.map(function(r){ return '<details'+(r[2]?' open':'')+'><summary>'+r[0]+'</summary><div class="body">'+r[1].replace("{phones}", phonesHtml())+'</div></details>'; }).join("");
  });
  [].forEach.call(document.querySelectorAll(".copyNum"), function(b){ b.addEventListener("click", function(){ copy(PHONES[+b.dataset.i][1], t("numLabel")); }); });
  $("rulesCard").innerHTML = t("rules").map(function(r){ return '<p><b>'+r[0]+'</b>'+(r[1]?' <span class="muted">'+r[1]+'</span>':'')+'</p>'; }).join("");
  $("qaWa").href = wa(t("wa").ask);
  $("planWa").href = wa(t("wa").ask);
  $("stuckWa").href = wa(t("wa").door);
  $("byeWa").href = wa(t("wa").bye);
  arr();
  status();
  renderSuggest(); renderAnswers($("askInput").value);
  showStep(); renderFilters(); renderPicks(); renderExtras(); renderChecklist();
  [].forEach.call($("langs").children, function(b){ b.setAttribute("aria-pressed", b.dataset.code===lang); });
}

function quietHours(month){
  // Greek police rule (Αστυνομική Διάταξη 3/1996): summer = 1 Apr–30 Sep, winter = 1 Oct–31 Mar
  var summer = month>=4 && month<=9;
  return summer ? {aft:[900,1050], night:[1380,420], label:["15:00–17:30","23:00–07:00"]}
                : {aft:[930,1050], night:[1320,450], label:["15:30–17:30","22:00–07:30"]};
}
function status(){
  var now = new Date();
  var parts = {};
  new Intl.DateTimeFormat("en-GB",{hour:"numeric",minute:"numeric",month:"numeric",hourCycle:"h23",timeZone:"Europe/Athens"}).formatToParts(now).forEach(function(x){ parts[x.type]=+x.value; });
  var h = parts.hour, m = h*60 + parts.minute;
  var tm = new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Athens"}).format(now);
  var hi = t("hello")[h<12?0:h<18?1:2];
  $("hello").textContent = GUEST ? hi.replace(/!?$/, ", " + GUEST + "!") : hi;
  var q = quietHours(parts.month);
  var quiet = (m>=q.aft[0] && m<q.aft[1]) || m>=q.night[0] || m<q.night[1];
  $("dot").classList.toggle("quiet", quiet);
  var next = m<q.aft[0] ? q.label[0] : q.label[1];
  $("statusText").innerHTML = fmt(t("statusNow"),{t:tm}) + " " + (quiet ? t("statusQuiet") : fmt(t("statusFree"),{n: next}));
}

// ask
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
var STOP = ["the","is","are","can","do","does","how","what","where","when","there","to","in","a","an","my","we","our","of","for","it","any","you","have","get","i","το","τα","η","ο","οι","να","και","που","πως","πού","τι","ειναι","εχει","υπαρχει","μου","σας","με","για","στο","στη","στην","θα"];
function search(q){
  var words = norm(q).split(/[^a-z0-9α-ω-]+/).filter(function(w){ return w.length>1 && STOP.indexOf(w)<0; });
  return L().kb.map(function(e){
    var hay = norm(e[1]+" "+e[0]).split(/\s+/), score=0;
    words.forEach(function(w){ hay.forEach(function(h){ if(h===w) score+=3; else if(h.indexOf(w)===0 || (w.indexOf(h)===0 && h.length>3)) score+=1; }); });
    return {e:e, score:score};
  }).filter(function(r){ return r.score>0; }).sort(function(a,b){ return b.score-a.score; }).slice(0,3);
}
function renderAnswers(q){
  var box=$("answers"); box.innerHTML="";
  if(!q || !q.trim()) return;
  var res = search(q);
  res.forEach(function(r){
    var d=document.createElement("div"); d.className="ans";
    d.innerHTML = "<b>"+r.e[0]+"</b><span>"+r.e[2].replace("{wifi}", WIFI_PASS || t("wifiHidden"))+"</span>"+(r.e[3]?'<a href="'+r.e[3]+'">'+t("seeDetails")+'</a>':"");
    box.appendChild(d);
  });
  var f=document.createElement("div"); f.className="ans";
  f.innerHTML = (res.length ? "<span class='muted'>"+t("notQuite")+"</span>" : "<b>"+t("notFound")+"</b>") + '<a class="btn wa" target="_blank" rel="noopener" href="'+wa(t("wa").q+q)+'">'+t("askWa")+'</a>';
  box.appendChild(f);
}

  $("stepNum").textContent = fmt(t("stepOf"),{a:cur+1,b:S.length});
  $("stepTitle").textContent=s[0]; $("stepText").innerHTML=s[1]; $("stepPhoto").hidden = !(s[3] && s[3].length); $("stepPhoto").innerHTML = (s[3]||[]).map(function(src){ return '<img src="'+src+'" alt="'+s[2]+'" loading="lazy">'; }).join("");
  [].forEach.call($("prog").children, function(el,i){ el.classList.toggle("on", i<=cur); });
  $("prevStep").style.visibility = cur===0 ? "hidden" : "visible";
  $("nextStep").textContent = cur===S.length-1 ? t("restart") : t("next");
}

function openTrip(link, fromEl){
  var d = TRIP_INFO[link]; if (!d) return;
  var row = t("picks").filter(function(p){ return p[3] === link; })[0]; if (!row) return;
  var txt = d[lang] || d.en, rows = "";
  [["dist", t("tripDist")], ["get", t("tripGet")], ["tip", t("tripTip")]].forEach(function(r){
    if (txt[r[0]]) rows += '<div class="trip-row"><b>'+r[1]+'</b><span>'+txt[r[0]].replace('{wa}', '<a href="'+wa(fmt(t("wa").trip,{x:row[1]}))+'" target="_blank" rel="noopener">').replace('{/wa}', '</a>')+'</span></div>';
  });
  $("tripImgs").className = "trip-imgs n" + d.img.length;
  $("tripImgs").innerHTML = d.img.map(function(src){ return '<img src="'+src+'" alt="">'; }).join("");
  $("tripImgs").hidden = !d.img.length;
  $("tripCat").textContent = row[0];
  $("tripTitle").textContent = row[1];
  $("tripDesc").innerHTML = row[2];
  $("tripRows").innerHTML = rows;
  $("tripMap").href = link; $("tripMap").textContent = t("tripMap");
  $("tripClose").setAttribute("aria-label", t("close"));
  var modal = $("tripModal"), card = $("tripCard");
  modal.hidden = false; document.body.classList.add("modal-open");
  // grow out of the card that was tapped
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (fromEl && !reduce) {
    var f = fromEl.getBoundingClientRect(), to = card.getBoundingClientRect();
    var sc = Math.max(.3, f.width / to.width);
    var dx = (f.left + f.width/2) - (to.left + to.width/2), dy = (f.top + f.height/2) - (to.top + to.height/2);
    card.style.transition = "none"; modal.classList.remove("show");
    card.style.transform = "translate("+dx+"px,"+dy+"px) scale("+sc+")";
    card.offsetWidth;
    card.style.transition = ""; card.style.transform = "";
  }
  requestAnimationFrame(function(){ modal.classList.add("show"); });
  tripFrom = fromEl; $("tripClose").focus({preventScroll:true});
}
var tripFrom = null;
function closeTrip(){
  var modal = $("tripModal"); if (modal.hidden) return;
  modal.classList.remove("show"); document.body.classList.remove("modal-open");
  setTimeout(function(){ modal.hidden = true; }, 200);
  if (tripFrom) { var b = tripFrom.querySelector(".trip-more"); if (b) b.focus({preventScroll:true}); }
}

// show our top places first; the rest open with "Show more" (order in the list = priority)
var PICKS_SHOWN = 4, picksOpen = false;
function renderPicks(){
  var c=cats()[active];
  var list = t("picks").filter(function(p){ return active===0 || p[0]===c; });
  var extra = list.length - PICKS_SHOWN;
  var btn = $("picksMore");
  btn.hidden = extra <= 0;
  btn.textContent = picksOpen ? t("showLess") : fmt(t("showMore"), {n: extra});
  btn.setAttribute("aria-expanded", picksOpen ? "true" : "false");
  if (!picksOpen) list = list.slice(0, PICKS_SHOWN);
  $("picks").innerHTML = list.map(function(p){
    var name = p[3] ? '<a href="'+p[3]+'" target="_blank" rel="noopener">'+p[1]+' <span aria-hidden="true">↗</span></a>' : p[1];
    var more = (p[3] && TRIP_INFO[p[3]]) ? '<button class="trip-more" type="button" data-link="'+p[3]+'">'+t("tripMore")+'</button>' : '';
    return '<div class="pick'+(more?' has-trip':'')+'"'+(more?' data-link="'+p[3]+'"':'')+'><span class="cat">'+p[0]+'</span><h3>'+name+'</h3><p>'+p[2]+'</p>'+more+'</div>';
  }).join("");
}

$("picks").addEventListener("click", function(e){
  if (e.target.closest("a")) return;
  var card = e.target.closest(".pick.has-trip"); if (!card) return;
  openTrip(card.getAttribute("data-link"), card);
});
$("tripModal").addEventListener("click", function(e){ if (e.target === this || e.target.closest("#tripClose")) closeTrip(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeTrip(); });
$("picksMore").addEventListener("click", function(){
  var wasOpen = picksOpen; picksOpen = !picksOpen; renderPicks();
  if (wasOpen) $("city").scrollIntoView({behavior:"smooth"});
});

// jump menu: highlight the section on screen and keep its chip visible
var JUMP = ["quick","arrive","door","home","rules","city","extras","faq","checkout","help"];
var activeSec = "quick";
function markActive(){
  var bar = $("jump");
  [].forEach.call(bar.children, function(el){
    var on = el.getAttribute("data-sec") === activeSec;
    el.setAttribute("aria-current", on ? "true" : "false");
    if (on) { var l = el.offsetLeft - 16; if (l < bar.scrollLeft || el.offsetLeft + el.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollTo({left: Math.max(0, l), behavior: "smooth"}); }
  });
}
function onScroll(){
  var y = window.scrollY + 90, cur = JUMP[0];
  JUMP.forEach(function(id){ var el = $(id); if (el && el.offsetTop <= y) cur = id; });
  if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 4) cur = JUMP[JUMP.length-1];
  if (cur !== activeSec) { activeSec = cur; markActive(); }
  $("fab").hidden = window.scrollY < 700;
}
window.addEventListener("scroll", onScroll, {passive:true});
$("fab").addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
